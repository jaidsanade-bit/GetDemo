<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eaf3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #b3d1ff;
        }

        h1 {
            color: #0066cc;
            text-align: center;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            color: #004080;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b3d1ff;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #004c99;
        }

        a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Registration</h1>
        <p>Create your account</p>

        <form action="login.html" method="get">
            <label for="name">Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Create password" required>

            <button type="submit">Register Now</button>
        </form>

        <p>Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>

</body>
</html>
