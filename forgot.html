
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eaf3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #b3d1ff;
        }

        h1 {
            color: #0066cc;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #555;
            line-height: 1.5;
        }

        label {
            display: block;
            color: #004080;
            font-weight: bold;
            margin: 22px 0 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b3d1ff;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0066cc;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #004c99;
        }

        .back {
            margin-top: 22px;
        }

        a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Forgot Password?</h1>

        <p>
            Don't worry! Enter your registered
            email address to reset your password.
        </p>

        <form action="login.html" method="get">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit">Reset Password</button>
        </form>

        <p class="back">
            Remember your password?
            <a href="login.html">Back to Login</a>
        </p>
    </div>

</body>
</html>
